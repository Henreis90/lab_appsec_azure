version: '3.8'

services:
  # --- ZONA INTERNA (Isolada do mundo externo) ---
  vault:
    image: hashicorp/vault:latest
    container_name: vault-lab
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_TOKEN}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - internal-net

  vault-init:
    image: hashicorp/vault:latest
    container_name: vault-init-setup
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_TOKEN}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      - vault
    command: >
      sh -c "
        sleep 3
        vault kv put secret/db user='$DB_USER' password='$DB_PASSWORD'
      "
    networks:
      - internal-net

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_local_lab
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
    # Adicionamos um comando que aguarda o banco subir e cria o banco "appdb" caso ele não exista
    #    command: >
    #  /bin/bash -c "
    #  /opt/mssql/bin/sqlservr &
    #  sleep 15
    #  /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD}' -Q 'IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = '\''appdb'\'') CREATE DATABASE appdb;'
    # wait
    #  "
    networks:
      - internal-net
    restart: unless-stopped
    # O SQL Server 2022 exige no mínimo 2GB. Se sua VM tiver pouca RAM,
    # defina o limite para evitar que o kernel do Linux mate o processo (OOM Kill).
    deploy:
      resources:
        limits:
          memory: 2G

  api:
    build: .
    container_name: api_python_lab
    # Sem 'ports:' expostas! A API agora só é acessível via Gateway.
    environment:
      - DB_SERVER=db
      - DB_NAME=appdb
      - VAULT_URL=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
    depends_on:
      - vault
      - vault-init
      - db
    networks:
      - internal-net

  # --- ZONA DMZ (Ponto de Entrada / Firewall / Proxy Reverso) ---
  gateway:
    image: nginx:latest
    container_name: nginx-gateway
    ports:
      - "8080:80" # O curl do usuário agora bate aqui no Gateway, e não direto na API
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - dmz-net
      - internal-net # O Gateway é o único que faz a ponte entre a DMZ e a Rede Interna

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak_lab
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "KeycloakAdminSecure123"
    command: ["start-dev"]
    ports:
      - "9080:8080"
    networks:
      - internal-net

networks:
  dmz-net:
    driver: bridge
  internal-net:
    driver: bridge
